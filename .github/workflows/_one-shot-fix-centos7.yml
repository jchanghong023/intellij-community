name: One-shot CentOS 7 packager repair

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/_one-shot-fix-centos7.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Fix pipefail-safe manylinux ABI probes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/package-and-verify-centos7-v2.sh')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'readelf --version-info --wide "${stdcpp}" | grep -Fq "Name: GLIBCXX_3.4.22"':
                  'readelf --version-info --wide "${stdcpp}" | grep -F "Name: GLIBCXX_3.4.22" >/dev/null',
              'readelf --version-info --wide "${stdcpp}" | grep -Fq "Name: CXXABI_1.3.9"':
                  'readelf --version-info --wide "${stdcpp}" | grep -F "Name: CXXABI_1.3.9" >/dev/null',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          bash -n .github/scripts/package-and-verify-centos7-v2.sh
          git diff --check
          git diff -- .github/scripts/package-and-verify-centos7-v2.sh

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/scripts/package-and-verify-centos7-v2.sh
          git commit -m "ci: fix manylinux ABI probe under pipefail"
          git push origin HEAD:master
