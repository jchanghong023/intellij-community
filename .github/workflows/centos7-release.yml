name: CentOS 7 Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: centos7-release
  cancel-in-progress: false

jobs:
  build-verify-and-release:
    name: Build, verify and publish PyCharm Linux x64 for CentOS 7
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ARTIFACTS_DIR: out/pycharm-ce/artifacts
      JBR_RELEASE_REPOSITORY: jchanghong023/JetBrainsRuntime

    steps:
      - name: Require the synchronized master branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "Run this release workflow from master after using Sync fork." >&2
            exit 1
          fi

      - name: Checkout sources
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      - name: Calculate build number
        id: versioning
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(tr -d '[:space:]' < build.txt)"
          if [[ ! "${snapshot}" =~ ^[0-9]+(\.[0-9]+)*\.SNAPSHOT$ ]]; then
            echo "Unexpected build.txt value: ${snapshot}" >&2
            exit 1
          fi

          base="${snapshot%.SNAPSHOT}"
          build_number="${base}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          echo "source_snapshot=${snapshot}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${build_number}" >> "${GITHUB_OUTPUT}"
          echo "Build number: ${build_number}"

      - name: Build upstream PyCharm Linux x64 distribution
        uses: ./.github/actions/build_ide
        with:
          product: pycharm
          swap_size: 30G
          system_properties: >-
            -Dbuild.number=${{ steps.versioning.outputs.build_number }}
            -Dintellij.build.target.os=linux
            -Dintellij.build.target.arch=x64

      - name: Reclaim Docker build space
        shell: bash
        run: |
          set -euo pipefail
          docker image rm pycharm >/dev/null 2>&1 || true
          docker builder prune --all --force >/dev/null 2>&1 || true
          df -h

      - name: Install ABI inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binutils

      - name: Package and verify CentOS 7 compatibility
        id: package
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/package-and-verify-centos7-v2.sh \
            "${ARTIFACTS_DIR}" \
            "${{ steps.versioning.outputs.build_number }}" \
            "${{ steps.versioning.outputs.source_snapshot }}"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_ARTIFACT: ${{ steps.package.outputs.artifact }}
          RELEASE_CHECKSUM: ${{ steps.package.outputs.checksum }}
          RELEASE_NOTES: ${{ steps.package.outputs.notes }}
          IS_PRERELEASE: ${{ steps.package.outputs.prerelease }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists." >&2
            exit 1
          fi

          flags=(
            --repo "${GITHUB_REPOSITORY}"
            --target "${GITHUB_SHA}"
            --title "${RELEASE_TAG}"
            --notes-file "${RELEASE_NOTES}"
          )
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi

          gh release create \
            "${RELEASE_TAG}" \
            "${RELEASE_ARTIFACT}" \
            "${RELEASE_CHECKSUM}" \
            "${flags[@]}"
